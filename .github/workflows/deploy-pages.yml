name: Deploy WALKBACK to GitHub Pages

# GitHub Pages must first be enabled in Settings → Pages → Build and deployment → GitHub Actions.
# Run this workflow manually after enabling Pages; automatic push runs are disabled because
# the connected GitHub integration cannot enable Pages settings on the user's behalf.
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
