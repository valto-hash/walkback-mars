<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#17110d">
<meta name="application-name" content="WALKBACK">
<meta name="description" content="Exploratory Mars traverse planner for Jezero Crater, combining NASA waypoint data and explicitly hypothetical EVA scenarios.">
<link rel="manifest" href="manifest.webmanifest">

<title>Jezero 3D · Rota WALKBACK</title>
<style>
:root{--bg:#f6efe6;--fg:#2a1d14;--mut:#6f5a47;--pan:#fffaf3;--bd:#d9c7b2;--ac:#c4511a;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#17110d;--fg:#f3e9dc;--mut:#c0a98f;--pan:#211812;--bd:#4a382a;--ac:#ff8a3d}}
:root[data-theme="dark"]{--bg:#17110d;--fg:#f3e9dc;--mut:#c0a98f;--pan:#211812;--bd:#4a382a;--ac:#ff8a3d}
html,body{height:100%;margin:0;background:var(--bg);color:var(--fg);font:14px/1.45 system-ui,-apple-system,Segoe UI,sans-serif}
body{display:flex;flex-direction:column}
#w{flex:1;min-height:240px;position:relative;background:#c9946a}
#c{position:absolute;inset:0;width:100%;height:100%;display:block}
#p{background:var(--pan);border-top:1px solid var(--bd);padding:10px 12px;max-height:46%;overflow:auto}
h1{font-size:16px;margin:0 0 4px}
.b{display:inline-block;padding:1px 8px;border-radius:10px;font-size:12px;border:1px solid var(--ac);color:var(--ac);white-space:nowrap}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:8px 0}
.row label{font-size:13px}
.btn{border:1px solid var(--ac);background:transparent;color:var(--ac);border-radius:6px;padding:4px 10px;cursor:pointer;font-size:13px;font-family:inherit}
.tw{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{text-align:left;padding:3px 6px;border-bottom:1px solid var(--bd);white-space:nowrap}
small,.m{color:var(--mut);font-size:12px}
.m{margin:6px 0}
h2{font-size:14px;margin:12px 0 4px}
.pc{border-top:1px solid var(--bd);padding:6px 0}
.pc>b{color:var(--ac)}
#hud{position:absolute;left:10px;bottom:10px;color:#fff;background:#000a;padding:6px 10px;border-radius:8px;font-size:13px;display:none;z-index:5;max-width:60%}
#env label{font-size:12px}#env input[type=range]{width:110px;vertical-align:middle}
details{margin-top:4px}summary{cursor:pointer;color:var(--ac);font-size:12px}
#dp{position:absolute;right:10px;bottom:10px;display:none;grid-template-columns:repeat(3,46px);gap:6px;z-index:5}
#dp button{height:46px;border-radius:10px;border:1px solid #fff8;background:#0007;color:#fff;font-size:18px;touch-action:none}
#hint{position:absolute;left:10px;top:10px;right:10px;color:#fff;background:#0008;padding:4px 8px;border-radius:6px;font-size:12px;display:none;z-index:5}
@media(max-width:700px){#p{max-height:62%;padding:9px}#w{min-height:180px}#env{gap:7px}#env label{max-width:100%}}
@media(prefers-reduced-motion:reduce){html:focus-within{scroll-behavior:auto}*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}
:focus-visible{outline:3px solid #1687ff!important;outline-offset:2px}
</style>
</head>

    <button class="btn" id="alertReset" type="button"></button>

    <small id="alertScenarioNote" class="m"></small>

  <small id="modelnote" class="m"></small>
  <small id="demstatus" class="m"></small>

  <div class="row"><button class="btn" id="sbt"></button><button class="btn" id="srt"></button><b id="snt"></b></div>

const D={
pt:['O Perseverance pousou aqui em 18/02/2021, num terreno liso escolhido por segurança. Para astronautas, o habitat ficaria a pelo menos 1 km do ponto de pouso, por causa dos detritos levantados pelo motor. Daqui saem os laços curtos a pé e a rota até a borda.','O delta se formou quando um rio, o Neretva Vallis, desaguava em um lago que enchia a cratera. As camadas inclinadas guardam a história da água e do clima. Perto daqui fica o depósito de amostras Three Forks.','Faixa de rochas rica em carbonatos (minerais que se formam com água) ao longo da margem interna. Estudos do Perseverance indicam que elas interagiram com água várias vezes, inclusive água subterrânea quente: ambientes que poderiam ter sido habitáveis.','Em julho de 2024 o rover amostrou esta rocha (amostra Sapphire Canyon). Os lamitos têm carbono orgânico e texturas incomuns que poderiam ter sido formadas por vida microbiana, mas processos sem vida ainda não foram descartados.','Último local de interesse geológico antes de o rover começar a subir para a borda. Daqui até Aurora Park/Pico Turquino são cerca de 1,8 km, com subida de cerca de 300 m (números da NASA).','Ao lado de Aurora Park, foi uma das primeiras regiões que a equipe quis estudar no topo da cratera. Daqui até Witch Hazel Hill são cerca de 2 km, com subida de cerca de 250 m (números da NASA).','O Perseverance chegou à borda em 12/12/2024 e passou meses explorando esta encosta. Coletou amostras como Main River e Bell Island (com esférulas minerais). Imagens de órbita mostram camadas que podem ter se formado sob um clima bem diferente do atual.','O fundo da cratera foi a primeira área explorada pelo rover. As rochas ígneas (de origem vulcânica) incluem alguns dos materiais mais antigos já amostrados em Jezero. O laço é opcional e fica perto da base.','Reserva de 10 tubos de amostra deixados no solo entre dez/2022 e jan/2023, para um futuro retorno à Terra. Os 10 tubos continuam em Marte. Uma recuperação por tripulação seria apenas um cenário hipotético futuro, não um plano aprovado. A posição no mapa é aproximada.'],
en:['Perseverance landed here on 18 Feb 2021, on smooth ground chosen for safety. For astronauts, the habitat would sit at least 1 km from the landing point because of debris kicked up by the engines. Short walking loops and the route to the rim start here.','The delta formed when a river, Neretva Vallis, flowed into a lake that filled the crater. The tilted layers hold the history of water and climate. The Three Forks sample depot is nearby.','A band of rock rich in carbonates (minerals that form with water) along the inner margin. Perseverance studies indicate it interacted with water several times, including hot groundwater: environments that could have been habitable.','In July 2024 the rover sampled this rock (Sapphire Canyon sample). The mudstones contain organic carbon and unusual textures that could have been formed by microbial life, but non-living processes have not been ruled out.','Last site of geological interest before the rover began climbing to the rim. From here to Aurora Park/Pico Turquino is about 1.8 km, with a climb of about 300 m (NASA figures).','Next to Aurora Park, one of the first regions the team wanted to study at the top of the crater. From here to Witch Hazel Hill is about 2 km, with a climb of about 250 m (NASA figures).','Perseverance reached the rim on 12 Dec 2024 and spent months exploring this slope. It collected samples such as Main River and Bell Island (with mineral spherules). Orbital images show layers that may have formed under a very different climate.','The crater floor was the first area the rover explored. The igneous (volcanic) rocks include some of the oldest materials sampled in Jezero. The loop is optional and close to the base.','A reserve of 10 sample tubes left on the ground between Dec 2022 and Jan 2023 for a future return to Earth. The 10 tubes remain on Mars. Crewed recovery is only a hypothetical future scenario, not an approved mission plan. The map position is approximate.'],
es:['Perseverance aterrizó aquí el 18/02/2021, en un terreno liso elegido por seguridad. Para astronautas, el hábitat estaría al menos a 1 km del punto de aterrizaje, por los restos que levantan los motores. De aquí salen los lazos cortos a pie y la ruta hasta el borde.','El delta se formó cuando un río, el Neretva Vallis, desembocaba en un lago que llenaba el cráter. Las capas inclinadas guardan la historia del agua y del clima. Cerca está el depósito de muestras Three Forks.','Franja de rocas ricas en carbonatos (minerales que se forman con agua) a lo largo del margen interno. Estudios de Perseverance indican que interactuaron con agua varias veces, incluida agua subterránea caliente: ambientes que podrían haber sido habitables.','En julio de 2024 el rover tomó muestra de esta roca (muestra Sapphire Canyon). Las lutitas tienen carbono orgánico y texturas inusuales que podrían haberse formado por vida microbiana, aunque aún no se descartan procesos sin vida.','Último lugar de interés geológico antes de que el rover empezara a subir al borde. De aquí a Aurora Park/Pico Turquino hay unos 1,8 km, con un ascenso de unos 300 m (cifras de la NASA).','Junto a Aurora Park, fue una de las primeras regiones que el equipo quiso estudiar en lo alto del cráter. De aquí a Witch Hazel Hill hay unos 2 km, con un ascenso de unos 250 m (cifras de la NASA).','Perseverance llegó al borde el 12/12/2024 y pasó meses explorando esta ladera. Recogió muestras como Main River y Bell Island (con esférulas minerales). Las imágenes orbitales muestran capas que pudieron formarse bajo un clima muy distinto al actual.','El suelo del cráter fue la primera zona que exploró el rover. Las rocas ígneas (volcánicas) incluyen algunos de los materiales más antiguos muestreados en Jezero. El lazo es opcional y queda cerca de la base.','Reserva de 10 tubos de muestra dejados en el suelo entre dic. de 2022 y ene. de 2023 para un futuro retorno a la Tierra. Los 10 tubos siguen en Marte. Su recuperación por una tripulación es solo un escenario futuro hipotético, no un plan aprobado. La posición en el mapa es aproximada.'],
de:['Perseverance landete hier am 18.02.2021 auf glattem, aus Sicherheitsgründen gewähltem Gelände. Für Astronauten läge das Habitat mindestens 1 km vom Landepunkt entfernt, wegen der von den Triebwerken aufgewirbelten Trümmer. Von hier starten die kurzen Fußschleifen und die Route zum Rand.','Das Delta entstand, als ein Fluss, der Neretva Vallis, in einen See mündete, der den Krater füllte. Die geneigten Schichten bewahren die Geschichte von Wasser und Klima. In der Nähe liegt das Probendepot Three Forks.','Gesteinsband, reich an Karbonaten (Mineralen, die mit Wasser entstehen), am inneren Rand. Studien von Perseverance zeigen, dass es mehrfach mit Wasser reagierte, auch mit heißem Grundwasser: Umgebungen, die bewohnbar gewesen sein könnten.','Im Juli 2024 beprobte der Rover dieses Gestein (Probe Sapphire Canyon). Die Tonsteine enthalten organischen Kohlenstoff und ungewöhnliche Texturen, die durch mikrobielles Leben entstanden sein könnten; nichtbiologische Prozesse sind nicht ausgeschlossen.','Letzter geologisch interessanter Ort, bevor der Rover zum Rand aufstieg. Von hier bis Aurora Park/Pico Turquino sind es etwa 1,8 km mit rund 300 m Anstieg (NASA-Angaben).','Neben Aurora Park, eines der ersten Gebiete, die das Team oben am Krater untersuchen wollte. Von hier bis Witch Hazel Hill sind es etwa 2 km mit rund 250 m Anstieg (NASA-Angaben).','Perseverance erreichte den Rand am 12.12.2024 und erkundete diesen Hang monatelang. Er sammelte Proben wie Main River und Bell Island (mit Mineral-Sphärulen). Orbitalbilder zeigen Schichten, die unter einem ganz anderen Klima entstanden sein könnten.','Der Kraterboden war das erste Gebiet, das der Rover erkundete. Die magmatischen (vulkanischen) Gesteine gehören zu den ältesten in Jezero beprobten Materialien. Die Schleife ist optional und liegt nahe der Basis.','Ein Vorrat von 10 Probenröhrchen, zwischen Dez. 2022 und Jan. 2023 am Boden abgelegt, für eine spätere Rückkehr zur Erde. Die 10 Röhrchen befinden sich weiterhin auf dem Mars. Eine Bergung durch eine Besatzung ist nur ein hypothetisches Zukunftsszenario, kein genehmigter Plan. Die Kartenposition ist ungefähr.']};

      const d=JSON.parse(await file.text());
      if(!d||d.schema!=='walkback.hirise-patch.v1'||!Number.isInteger(d.width)||!Number.isInteger(d.height)||d.width<3||d.height<3||d.width>501||d.height>501||!Array.isArray(d.values_m)||d.values_m.length!==d.width*d.height)throw new Error('Expected a walkback.hirise-patch.v1 elevation grid, up to 501×501 cells.');
      const valid=d.values_m.reduce((n,v)=>n+(v!==null&&v!==''&&Number.isFinite(Number(v))?1:0),0);
      if(valid/d.values_m.length<.98)throw new Error('Less than 98% valid elevation cells.');
      if(!Number.isFinite(Number(d.native_pixel_size_m))||Number(d.native_pixel_size_m)<=0)throw new Error('Missing native pixel size.');
      state.hiriseInfo={source:d.source||'HiRISE DTM',pixelSize:Number(d.native_pixel_size_m),width:d.width,height:d.height};state.hiriseData=d;
      renderHirisePatch(d);
    } catch(e) { $('#advHiriseStatus').textContent=`${tr().invalid}: ${e.message}`; }
  }
  function updateLanguage() {
    if(!state.initialized)return;
    const old=$('#advancedPanel');if(old){old.remove();renderPanel();bindPanelEvents();}
    updateResourceDisplay();updateRadioStatus();
    if(state.themisInfo&&$('#advThemisStatus'))$('#advThemisStatus').textContent=`${tr().loaded}: ${state.themisInfo.source} · qualitative only.`;
    if(state.hiriseData&&$('#advHiriseCanvas'))renderHirisePatch(state.hiriseData);
  }
  function bindPanelEvents() {
    ['advO2','advEnergy','advCooling','advCO2','advTasks','advRest','advUncertainty'].forEach(id=>$('#'+id).addEventListener('change',updateResourceModel));
    $('#advSurface').addEventListener('change',updateResourceModel);
    $('#advPace').addEventListener('change',e=>{state.pace=e.target.value;if(state.pace==='custom')return;const v=pace[state.pace]||2.5;$('#r2').value=v;$('#r2').dispatchEvent(new Event('input',{bubbles:true}));updateResourceModel();});
    ['advFreq','advPower','advTxGain','advRxGain','advLoss','advSensitivity','advThreshold'].forEach(id=>$('#'+id).addEventListener('change',updateRadioInputs));
    $('#advThemisFile').addEventListener('change',e=>e.target.files[0]&&loadThemis(e.target.files[0]));
    $('#advThemisToggle').addEventListener('change',e=>{state.themisVisible=e.target.checked;terrain();if(typeof draw==='function')draw()});
    $('#advHiriseFile').addEventListener('change',e=>e.target.files[0]&&loadHirise(e.target.files[0]));
  }
  function init() {
    if(state.initialized||!$('#env'))return;
    state.initialized=true;renderPanel();bindPanelEvents();
    const style=document.createElement('style');style.textContent=`
      #advancedPanel{border-top:1px solid var(--bd);padding:6px 0;margin-top:8px}
      #advancedPanel summary{font-size:13px;font-weight:700}
      .adv-section{padding:7px 0;border-bottom:1px solid var(--bd)}
      .adv-section h3{font-size:13px;margin:2px 0 7px}
      .adv-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(175px,1fr));gap:7px}
      .adv-field{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:12px;min-width:0}
      .adv-field input,.adv-field select{width:88px;max-width:48%;min-width:72px;padding:4px;border:1px solid var(--bd);border-radius:5px;background:var(--pan);color:var(--fg);font:inherit}
      .adv-field select{width:auto;max-width:62%}
      :focus-visible{outline:3px solid #1687ff!important;outline-offset:2px}
      @media(max-width:700px){#p{max-height:62%;padding:9px}#w{min-height:180px}.adv-grid{grid-template-columns:1fr 1fr}.adv-field{align-items:flex-start;flex-direction:column}.adv-field input,.adv-field select{max-width:100%;width:100%}}
      @media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}
    `;document.head.append(style);
    const oldSetLang=setLang;
    setLang=function(l){oldSetLang(l);updateLanguage()};
    // Keep original pace control synchronized with the advanced preset.
    const oldR2=$('#r2');oldR2.addEventListener('input',()=>{const select=$('#advPace');if(select){const v=Number(oldR2.value);state.pace=Object.keys(pace).find(k=>pace[k]===v)||'custom';select.value=state.pace}});
    const oldR3=$('#r3');oldR3.addEventListener('input',updateResourceModel);
    // Re-run after base initialisation, with explicit resource overhead and uncertainty.
    $('#r1').disabled=true;$('#r1').closest('label').hidden=true;
    updateResourceModel();
    updateRadioInputs();
    setLang(lang);
  }
  if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',init,{once:true});else init();
})();

</script>
<script>if('serviceWorker' in navigator && location.protocol.startsWith('http'))window.addEventListener('load',()=>navigator.serviceWorker.register('./service-worker.js').catch(e=>console.warn('WALKBACK offline cache unavailable',e)));</script>
</body>
